[project]
name = "fred-mcp"
version = "0.1.0"
description = "A FastMCP server exposing FRED (Federal Reserve Economic Data) API as MCP tools"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Bertram Labs" },
]
keywords = ["fred", "economics", "mcp", "model-context-protocol", "fastmcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.28",
    "pydantic-settings>=2.0",
]

[project.scripts]
fred-mcp = "fred_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fred_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
]
